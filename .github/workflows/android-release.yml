name: Android release APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName (e.g. 1.0.1)"
        required: true
        default: "1.0.1"
      versionCode:
        description: "versionCode (must increase every release)"
        required: true
        default: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YARD_KEYSTORE_PATH: yard-release.keystore
      YARD_KEYSTORE_PASSWORD: ${{ secrets.YARD_KEYSTORE_PASSWORD }}
      YARD_KEY_ALIAS: ${{ secrets.YARD_KEY_ALIAS }}
      YARD_KEY_PASSWORD: ${{ secrets.YARD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 YARD_KEYSTORE_PASSWORD YARD_KEY_ALIAS YARD_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/yard-release.keystore
          test -s android/yard-release.keystore

      - name: Sync Capacitor (regenerates native plugin list)
        run: npx cap sync android

      - name: Apply version
        run: |
          sed -i 's/versionCode .*/versionCode ${{ inputs.versionCode }}/' android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "${{ inputs.versionName }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yard-v${{ inputs.versionName }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
